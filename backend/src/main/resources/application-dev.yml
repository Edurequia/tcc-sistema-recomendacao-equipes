# ---------------------------------------------------------------------------
# Perfil "dev": sobe sem nenhuma instalacao externa.
# Banco H2 em memoria, recriado a cada inicializacao.
# Console do H2 em http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:teamrec)
# ---------------------------------------------------------------------------
spring:
  datasource:
    url: jdbc:h2:mem:teamrec;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# Carga inicial do catalogo de habilidades (idempotente: so roda com o catalogo vazio)
app:
  seed:
    catalogo: true
